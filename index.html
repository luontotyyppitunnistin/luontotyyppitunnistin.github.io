<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#005854">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<title>Luontotyyppitunnistin</title>
<meta name="description" content="Tunnistaa luontotyypin valokuvasta.">
<style>
  :root {
    color-scheme: light;

    --bg: #ffffff;
    --surface: #edece9;         /* vaaleanharmaa, cards */
    --surface-blue: #CFE9EA;    /* vaaleansininen */
    --text: #005854;            /* tummanvihreä: text, headings, links */
    --muted: #575756;           /* tummanharmaa */
    --line: rgba(0, 88, 84, 0.2);
    --accent: #005854;
    --accent-hover: #00706b;
    --accent-text: #ffffff;
    --accent-soft: #C7E3D2;     /* vaaleanvihreä */
    --warn: #bb5b0f;            /* okra */
    --warn-bg: #FED992;         /* vaaleankeltainen */
    --err: #9E3B2A;             /* tummanpunainen, darkened for contrast on light blue */
    --err-bg: #FCD9C9;          /* vaaleanpunainen */
    --link-hover: #B34733;      /* tummanpunainen */
    --bar: #84C497;
    --focus: #006085;           /* tummansininen */
    --gap: 30px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* .drop/.picked set display, which would otherwise beat [hidden] */
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Poppins", Arial, sans-serif;
  }
  .wrap { max-width: 1110px; margin: 0 auto; padding: 0 16px; }
  a { color: inherit; }
  a:hover, button.link:hover { text-decoration-color: var(--link-hover); }
  h1, h2 { font-weight: 600; line-height: 1.2; }

  /* ---- hero ---- */
  .hero { position: relative; background: var(--accent); color: #ffffff; }
  .hero-inner { padding-top: 48px; padding-bottom: 48px; }
  .hero-text { max-width: 720px; }
  h1 { font-size: 2rem; margin: 0 0 24px; }
  p.lead { margin: 0; }

  main { flex: 1; width: 100%; max-width: 1110px; margin: 0 auto; padding: 40px 16px 64px; }
  h2 { font-size: 1.375rem; margin: 0 0 12px; }

  .arrow-link {
    display: inline-flex; align-items: center; font-weight: 600; text-decoration: none;
  }
  .arrow-link svg { flex: none; margin-right: 12px; transition: transform 0.2s ease-in-out; }
  .arrow-link:hover, .arrow-link:focus-visible { text-decoration: underline; text-decoration-color: var(--link-hover); }
  .arrow-link:hover svg, .arrow-link:focus-visible svg { transform: translateX(5px); }
  svg.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px; border: 1px solid transparent;
    background: var(--accent-soft); font-size: 0.9rem; margin-bottom: var(--gap);
  }
  .status.warn { background: var(--warn-bg); border-color: var(--warn); }
  .status.err { background: var(--err-bg); border-color: var(--err); }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid currentColor; border-right-color: transparent;
    animation: spin 0.8s linear infinite; flex: none;
  }
  .status:not(.busy) .spinner, button:not(.busy) .spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card { background: var(--surface); border-radius: 16px; padding: 24px 32px 32px; }
  .card.upload { background: var(--surface-blue); }
  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; min-height: 160px; text-align: center;
    border: 2px dashed var(--accent); border-radius: 12px; padding: 16px;
    cursor: pointer; transition: background 0.15s;
  }
  .drop:hover, .drop.over { background: rgba(255, 255, 255, 0.6); }
  .drop small { color: var(--muted); }
  .picked { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .picked canvas { max-width: 220px; max-height: 160px; width: auto; height: auto; border-radius: 8px; }

  button.primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--accent-text); border: 0;
    padding: 12px 24px; border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
  button.link {
    background: none; border: 0; padding: 0; font: inherit; font-weight: 600;
    color: var(--text); cursor: pointer; text-decoration: none;
  }
  button:focus-visible, .drop:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .actions { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 0.9rem; }
  #error { color: var(--err); margin-top: 12px; }

  /* ---- "how it works" dropdown ---- */
  .how { margin-top: var(--gap); }
  .how-toggle { display: inline-flex; align-items: center; gap: 12px; }
  .how-toggle svg { flex: none; transition: transform 0.2s ease-in-out; }
  .how-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .how-body { margin-top: 16px; max-width: 70ch; white-space: pre-line; }

  #results { margin-top: var(--gap); }
  /* one map + the class list; side by side on wide screens (map stays in view while picking classes) */
  .views { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); }
  @media (min-width: 900px) {
    .views { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
    .map-card { position: sticky; top: 16px; }
  }
  .map-card canvas { width: 100%; height: auto; max-height: 80vh; object-fit: contain; border-radius: 8px; display: block; background: var(--line); }
  #show-predicted { margin-top: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 0.88rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .list .hint { margin: 0 0 16px; max-width: 70ch; }

  .scroll { max-height: 640px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--surface); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr[data-name] { cursor: pointer; }
  tbody tr[data-name]:hover { background: #ffffff; }
  tbody tr.sel { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
  tbody tr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .pbar { position: relative; min-width: 90px; }
  .pbar i { position: absolute; inset: 3px auto 3px 0; background: var(--bar); opacity: 0.6; border-radius: 3px; }
  .pbar b { position: relative; font-weight: 400; padding-left: 4px; }
  .empty { color: var(--muted); padding: 8px; }
  /* group headings of the single list (probability bands) */
  tr.group td { padding: 14px 8px 6px; font-weight: 600; border-bottom: 2px solid var(--accent); }
  tr.group.below td { border-bottom-color: var(--line); color: var(--muted); }

  /* ---- footer ---- */
  .footer { margin-top: auto; background: var(--accent); color: #ffffff; }
  .footer-inner {
    padding-top: 32px; padding-bottom: 32px;
  }
  .footer p { margin: 0; max-width: 60ch; }

  @media (max-width: 600px) {
    .card { padding: 20px; }
    h1 { font-size: 1.6rem; }
  }
</style>

<main>

  <div id="status" class="status busy" role="status" aria-live="polite">
    <span class="spinner"></span><span id="status-text"></span>
  </div>

  <section class="card upload">
    <div id="drop" class="drop" tabindex="0" role="button" data-aria-label="dropAria">
      <strong data-text="dropTitle"></strong>
      <small data-text="dropHint"></small>
    </div>
    <input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" hidden>
    <div id="picked" class="picked" hidden>
      <canvas id="preview"></canvas>
      <div>
        <div class="actions">
          <button id="predict" class="primary" type="button">
            <span class="spinner"></span><span id="predict-text"></span>
          </button>
          <button id="change" class="link arrow-link" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-text="changeImage"></span></button>
        </div>
        <p id="predict-hint" class="hint"></p>
      </div>
    </div>
    <div id="error" role="alert" hidden></div>
  </section>

  <section class="card how">
    <button id="how-toggle" class="link how-toggle" type="button" aria-expanded="false" aria-controls="how-body">
      <span data-text="howTitle"></span>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>

        <button id="show-predicted" class="link arrow-link" type="button" hidden>

        </button>
      </div>
      <div class="card list">
        <h2 data-text="listTitle"></h2>
        <p class="hint" data-text="listHint"></p>
        <div class="scroll"><table id="t-all"></table></div>
      </div>
    </div>
  </section>

</main>
<footer class="footer">
  <div class="wrap footer-inner">

<script>
// ======================================================================
// TEKSTIT / UI TEXTS: edit the visible texts here.

// ======================================================================
const TEXT = {
  // Page
  heroLead:
    "Tulkitsee kuvasta todennäköisimmän luontotyypin ja havainnollistaa vaikutuskartoilla, mitkä alueet kuvassa viittaavat kuhunkin luokkaan. " +
    "Klikkaa luokan nimeä kummassa tahansa taulukossa luokkakohtaisia vaikutuskarttoja varten.",
  footer: "Ennusteet ovat kokeellisia. Kuvat analysoidaan omalla palvelimellaan, eikä niitä tallenneta tai lähetetä kolmansille osapuolille.",

  // How it works (dropdown)
  howTitle: "Kuinka tunnistin toimii?",
  howBody:
    "Tunnistin käsittelee kuvan Sykessä kehitetyllä konenäköalgoritmilla. Kuva jaetaan pieniin ruutuihin " +
    "ja esikoulutettu konenäkömalli laskee koko kuvalle sekä jokaiselle ruudulle _piirrevektorin_, " +
    "joka on kompakti esitysmuoto kuvan visuaalisesta sisällöstä.\n\n" +
    "Piirrevektorit syötetään luokittelumallille, joka on sovitettu suuren kuvapankin avulla tunnistamaan " +
    "visuaalisten piirteiden ja luontotyyppien välisiä yhteyksiä. Malli antaa jokaiselle luontotyypille " +

    "_Vaikutuskartta_ havainnoillistaa, mitkä kuvanruudut ovat visuaalisesti samanlaisia muiden luontotyyppiä" +
    "edustavien kuvien kanssa.",

  // Upload
  dropAria: "Valitse kuva tai pudota se tähän",
  dropTitle: "Pudota kuva tähän tai valitse napsauttamalla",
  dropHint: "JPEG, PNG tai WebP. Suuret kuvat pienennetään selaimessasi ennen lähetystä.",
  changeImage: "Valitse toinen kuva",
  predict: "Tunnista",
  predicting: "Analysoidaan…",
  modelStillLoading: "Mallia ladataan...",

  // Results
  overlayTitle: "Vaikutuskartta",
  selectedTitle: "Valitun luokan vaikutuskartta",
  showPredicted: "Näytä kaikki ennustetut",
  listTitle: "Luontotyypit",
  listHint:
    "Todennäköisyys on arvio siitä, että luontotyyppiä esiintyy kuvassa.",
  groupCertain: "Lähes varmat luontotyypit",
  groupLikely: "Todennäköiset luontotyypit",
  groupPossible: "Muut mahdolliset luontotyypit",
  groupUnlikely: "Epätodennäköiset luontotyypit",
  showUnlikely: "Näytä",
  hideUnlikely: "Piilota",
  colClass: "Luontotyyppi",
  colProbability: "Todennäköisyys",
  noneLikely: "Mikään luokka ei ole todennäköinen.",

  // Server status
  connecting: "Yhdistetään mallipalvelimeen…",
  modelReady: "Malli valmis",
  modelLoading: "Ladataan mallia…",
  modelLoadingCanPick: " voit jo valita kuvan.",
  modelLoadFailed: "Mallin lataus epäonnistui: ",   // + server error
  serverRetrying: "Palvelimeen ei saada yhteyttä, yritetään uudelleen…",

  // Errors
  notAnImage: "Valitse kuvatiedosto.",
  unreadableImage: "Kuvaa ei voitu lukea.",
  serverUnreachable: "Palvelimeen ei saatu yhteyttä. Yritä uudelleen.",
  serverError: "Palvelinvirhe (HTTP ",               // + status + ")"
};

// data-rich elements: _word_ becomes <em>word</em> (built as DOM nodes, so no HTML is ever parsed).
function renderRich(el, text) {
  el.replaceChildren(...text.split(/_([^_]+)_/).map((part, i) => {
    if (i % 2 === 0) return part;
    const em = document.createElement("em");
    em.textContent = part;
    return em;
  }));
}

for (const el of document.querySelectorAll("[data-text]")) {
  const text = TEXT[el.dataset.text];
  if ("rich" in el.dataset) renderRich(el, text);
  else el.textContent = text;
}
for (const el of document.querySelectorAll("[data-aria-label]")) el.setAttribute("aria-label", TEXT[el.dataset.ariaLabel]);

<script>
"use strict";

const API = "https://mikkoim--habitat-codebook-api-api.modal.run";
const MAX_SIDE = 1024;        // keep in sync with MAX_SIDE in src/habitat_image/serving.py
const OVERLAY_ALPHA = 0.7;
// Probability bands of the result list. Classes from `likely` up count as predicted (overlay, legend); this is the
// decision threshold of scripts/image/calibrate_predictions.py (DECISION_THRESHOLD). The API's own `threshold` and
// `predicted` fields are not used.
const BANDS = { certain: 0.90, likely: 0.35, possible: 0.05 };

const $ = (id) => document.getElementById(id);
const els = {
  status: $("status"), statusText: $("status-text"),
  drop: $("drop"), file: $("file"), picked: $("picked"), preview: $("preview"),
  predict: $("predict"), predictText: $("predict-text"), predictHint: $("predict-hint"),
  change: $("change"), error: $("error"),
  results: $("results"), mapCard: $("map-card"), map: $("map"),
  mapTitle: $("map-title"), legend: $("legend"), showPredicted: $("show-predicted"),
  table: $("t-all"),
  howToggle: $("how-toggle"), howBody: $("how-body"),
};

const state = {
  ready: false,       // model loaded on the server
  image: null,        // canvas holding the downscaled upload
  busy: false,
  data: null,         // last /predict response, masks decoded
  base: null,         // ImageData of the image at response size
  selected: null,     // selected class name; null = show all predicted classes
};

// ---------- server status: also wakes the Modal container ----------

function setStatus(text, kind) {
  els.statusText.textContent = text;
  els.status.className = "status" + (kind ? " " + kind : "");
}

async function pollStatus(attempt = 0) {
  try {
    const r = await fetch(API + "/status");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = await r.json();
    if (s.error) {
      setStatus(TEXT.modelLoadFailed + s.error, "err");
      return;
    }
    if (s.ready) {
      state.ready = true;
      setStatus(TEXT.modelReady, "");
      updatePredictButton();
      return;
    }
    setStatus(TEXT.modelLoading + (state.image ? "" : TEXT.modelLoadingCanPick), "busy");
    setTimeout(() => pollStatus(0), 1000);
  } catch (e) {
    setStatus(TEXT.serverRetrying, "warn busy");
    setTimeout(() => pollStatus(attempt + 1), Math.min(1000 * 2 ** attempt, 10000));
  }
}

// ---------- image selection ----------

async function loadImage(file) {
  if (!file || !file.type.startsWith("image/")) {
    showError(TEXT.notAnImage);
    return;
  }
  showError("");
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
  } catch {
    showError(TEXT.unreadableImage);
    return;
  }
  const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bitmap.width * scale));
  c.height = Math.max(1, Math.round(bitmap.height * scale));
  c.getContext("2d").drawImage(bitmap, 0, 0, c.width, c.height);
  bitmap.close();

  state.image = c;
  els.preview.width = c.width;
  els.preview.height = c.height;
  els.preview.getContext("2d").drawImage(c, 0, 0);
  els.drop.hidden = true;
  els.picked.hidden = false;
  els.results.hidden = true;
  state.data = null;
  state.selected = null;
  updatePredictButton();
}

function updatePredictButton() {
  els.predict.disabled = !state.image || state.busy;
  els.predict.classList.toggle("busy", state.busy);
  els.predictText.textContent = state.busy ? TEXT.predicting : TEXT.predict;
  els.predictHint.textContent =
    state.image && !state.ready && !state.busy
      ? TEXT.modelStillLoading
      : "";
}

function showError(msg) {
  els.error.textContent = msg;
  els.error.hidden = !msg;
}

// ---------- prediction ----------

function decodeMask(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function predict() {
  if (!state.image || state.busy) return;
  state.busy = true;
  showError("");
  updatePredictButton();
  try {
    const blob = await new Promise((res) => state.image.toBlob(res, "image/jpeg", 0.9));
    const form = new FormData();
    form.append("file", blob, "image.jpg");
    const r = await fetch(API + "/predict", { method: "POST", body: form });
    if (!r.ok) {
      let detail = "";
      try { detail = (await r.json()).detail; } catch {}
      throw new Error(detail || TEXT.serverError + r.status + ")");
    }
    const data = await r.json();
    for (const c of data.classes) c.maskData = decodeMask(c.mask);
    state.data = data;
    state.ready = true;
    showResults();
  } catch (e) {
    showError(e instanceof TypeError ? TEXT.serverUnreachable : e.message);
  } finally {
    state.busy = false;
    updatePredictButton();
  }
}

// ---------- rendering ----------

function prepareBase(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.drawImage(state.image, 0, 0, w, h);
  return ctx.getImageData(0, 0, w, h);
}

// Tints the brightened base image by `weight(cellIndex) -> [score 0..1, [r, g, b]]`.
function drawTinted(canvas, scoreAt, alpha) {
  const { width: W, height: H, grid } = state.data;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const out = ctx.createImageData(W, H);
  const src = state.base.data, dst = out.data;
  const colX = new Int32Array(W);
  for (let x = 0; x < W; x++) colX[x] = Math.min(grid.w - 1, Math.floor((x * grid.w) / W));
  let p = 0;
  for (let y = 0; y < H; y++) {
    const rowOff = Math.min(grid.h - 1, Math.floor((y * grid.h) / H)) * grid.w;
    for (let x = 0; x < W; x++, p += 4) {
      const [s, color] = scoreAt(rowOff + colX[x]);
      const a = alpha * s;
      for (let ch = 0; ch < 3; ch++) {
        const base = 0.8 * src[p + ch] + 0.2 * 255;   // brighten so overlays stand out
        dst[p + ch] = base * (1 - a) + color[ch] * a;
      }
      dst[p + 3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
}

const isPredicted = (c) => c.probability >= BANDS.likely;

function drawOverlay() {
  const predicted = state.data.classes.filter(isPredicted);
  if (!predicted.length) {
    drawTinted(els.map, () => [0, [0, 0, 0]], 0);
    return;
  }
  // Per patch, the predicted class with the strongest attribution wins.
  const cells = state.data.grid.h * state.data.grid.w;
  const best = new Float32Array(cells);
  const bestColor = new Array(cells).fill(predicted[0].color);
  for (const c of predicted) {
    for (let i = 0; i < cells; i++) {
      const v = c.maskData[i] / 255;
      if (v > best[i]) { best[i] = v; bestColor[i] = c.color; }
    }
  }
  drawTinted(els.map, (i) => [best[i], bestColor[i]], OVERLAY_ALPHA);
}

function drawSelected(c) {
  drawTinted(els.map, (i) => [c.maskData[i] / 255, c.color], 1);
}

function legendItem(color, label) {
  const item = document.createElement("span");
  const sw = document.createElement("i");
  sw.className = "swatch";
  sw.style.background = "rgb(" + color.join(",") + ")";
  item.append(sw, label);
  els.legend.appendChild(item);
}

// The single map: all predicted classes by default, or only the selected class. Title and legend follow.
function renderMap() {
  const { classes } = state.data;
  const sel = classes.find((k) => k.name === state.selected);
  els.legend.replaceChildren();
  if (sel) {
    els.mapTitle.textContent = TEXT.selectedTitle;
    drawSelected(sel);
    legendItem(sel.color, sel.name + " (" + pct(sel.probability) + ")");
  } else {
    els.mapTitle.textContent = TEXT.overlayTitle;
    drawOverlay();
    for (const c of classes.filter(isPredicted)) legendItem(c.color, c.name);
  }
  els.showPredicted.hidden = !sel;
  for (const tr of document.querySelectorAll("tbody tr[data-name]")) {
    tr.classList.toggle("sel", tr.dataset.name === state.selected);
  }
}

function cell(text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

// Probability as a Finnish percentage with one decimal ("97,3 %").
function pct(p) {
  return (p * 100).toLocaleString("fi-FI", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " %";
}

function groupRow(body, title, below) {
  const tr = body.insertRow();
  tr.className = "group" + (below ? " below" : "");
  const td = tr.insertCell();
  td.colSpan = 2;
  td.textContent = title;
  return td;
}

function probabilityRow(body, c) {
  const tr = body.insertRow();
  tr.tabIndex = 0;
  tr.dataset.name = c.name;
  tr.appendChild(cell(c.name));
  const bar = document.createElement("td");
  bar.className = "pbar";
  const fill = document.createElement("i");
  fill.style.width = (c.probability * 100).toFixed(1) + "%";
  const label = document.createElement("b");
  label.textContent = pct(c.probability);
  bar.append(fill, label);
  tr.appendChild(bar);
  const select = () => selectClass(c.name);
  tr.addEventListener("click", select);
  tr.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); }
  });
}

// One list sorted by probability, in four bands. The classes are sorted by the API, so each band is a run of rows.
// Empty bands are left out, except the "likely" one (the main list), which says so when it is empty.
// The classes below the lowest band are collapsed.
function fillList(table, classes) {
  table.replaceChildren();
  const head = table.createTHead().insertRow();
  for (const name of [TEXT.colClass, TEXT.colProbability]) {
    const th = document.createElement("th");
    th.textContent = name;
    head.appendChild(th);
  }
  const body = table.createTBody();
  const band = (lo, hi) => classes.filter((c) => c.probability >= lo && (hi === undefined || c.probability < hi));
  const certain = band(BANDS.certain);
  const likely = band(BANDS.likely, BANDS.certain);
  const possible = band(BANDS.possible, BANDS.likely);
  const unlikely = classes.filter((c) => c.probability < BANDS.possible);

  if (certain.length) {
    groupRow(body, TEXT.groupCertain, false);
    for (const c of certain) probabilityRow(body, c);
  }
  groupRow(body, TEXT.groupLikely, false);
  if (!likely.length) {
    const td = body.insertRow().insertCell();
    td.colSpan = 2;
    td.className = "empty";
    td.textContent = TEXT.noneLikely;
  }
  for (const c of likely) probabilityRow(body, c);
  if (possible.length) {
    groupRow(body, TEXT.groupPossible, true);
    for (const c of possible) probabilityRow(body, c);
  }
  if (unlikely.length) {
    const cellEl = groupRow(body, TEXT.groupUnlikely, true);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "link";
    button.textContent = TEXT.showUnlikely;
    button.setAttribute("aria-expanded", "false");
    cellEl.append(" ", button);
    const rows = [];
    for (const c of unlikely) {
      probabilityRow(body, c);
      const tr = body.lastChild;
      tr.hidden = true;
      rows.push(tr);
    }
    button.addEventListener("click", () => {
      const open = button.getAttribute("aria-expanded") !== "true";
      button.setAttribute("aria-expanded", String(open));
      button.textContent = open ? TEXT.hideUnlikely : TEXT.showUnlikely;
      for (const tr of rows) tr.hidden = !open;
    });
  }
}

// Clicking the selected class again goes back to the predicted-classes map.
function selectClass(name) {
  state.selected = state.selected === name ? null : name;
  renderMap();
  // stacked (narrow) layout: bring the map into view if the list was tapped far below it
  if (els.mapCard.getBoundingClientRect().top < 0) els.mapCard.scrollIntoView({ behavior: "smooth", block: "start" });
}

function showResults() {
  const { width, height, classes } = state.data;
  state.base = prepareBase(width, height);
  state.selected = null;

  fillList(els.table, classes);
  renderMap();
  els.results.hidden = false;
  els.results.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---------- wiring ----------

els.drop.addEventListener("click", () => els.file.click());
els.drop.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); els.file.click(); }
});
els.change.addEventListener("click", () => els.file.click());
els.file.addEventListener("change", () => {
  loadImage(els.file.files[0]);
  els.file.value = "";
});
for (const ev of ["dragenter", "dragover"]) {
  els.drop.addEventListener(ev, (e) => { e.preventDefault(); els.drop.classList.add("over"); });
}
for (const ev of ["dragleave", "drop"]) {
  els.drop.addEventListener(ev, (e) => { e.preventDefault(); els.drop.classList.remove("over"); });
}
els.drop.addEventListener("drop", (e) => loadImage(e.dataTransfer.files[0]));
els.predict.addEventListener("click", predict);
els.showPredicted.addEventListener("click", () => { state.selected = null; renderMap(); });
els.howToggle.addEventListener("click", () => {
  const open = els.howToggle.getAttribute("aria-expanded") !== "true";
  els.howToggle.setAttribute("aria-expanded", String(open));
  els.howBody.hidden = !open;
});

setStatus(TEXT.connecting, "busy");
updatePredictButton();
pollStatus();
</script>
</body>
</html>
