<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#005854">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<title>Luontotyyppitunnistin</title>
<meta name="description" content="Tunnistaa luontotyypin valokuvasta.">
<style>
  :root {
    color-scheme: light;

    --bg: #ffffff;
    --surface: #edece9;         /* vaaleanharmaa, cards */
    --surface-blue: #CFE9EA;    /* vaaleansininen */
    --text: #005854;            /* tummanvihreä: text, headings, links */
    --muted: #575756;           /* tummanharmaa */
    --line: rgba(0, 88, 84, 0.2);
    --accent: #005854;
    --accent-hover: #00706b;
    --accent-text: #ffffff;
    --accent-soft: #C7E3D2;     /* vaaleanvihreä */
    --warn: #bb5b0f;            /* okra */
    --warn-bg: #FED992;         /* vaaleankeltainen */
    --err: #9E3B2A;             /* tummanpunainen, darkened for contrast on light blue */
    --err-bg: #FCD9C9;          /* vaaleanpunainen */
    --link-hover: #B34733;      /* tummanpunainen */
    --bar: #84C497;
    --focus: #006085;           /* tummansininen */
    --gap: 30px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* .drop/.picked set display, which would otherwise beat [hidden] */
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Poppins", Arial, sans-serif;
  }
  .wrap { max-width: 1110px; margin: 0 auto; padding: 0 16px; }
  a { color: inherit; }
  a:hover, button.link:hover { text-decoration-color: var(--link-hover); }
  h1, h2 { font-weight: 600; line-height: 1.2; }

  /* ---- hero ---- */
  .hero { position: relative; background: var(--accent); color: #ffffff; }
  .hero-inner { padding-top: 48px; padding-bottom: 48px; }
  .hero-text { max-width: 720px; }
  h1 { font-size: 2rem; margin: 0 0 24px; }
  p.lead { margin: 0; }

  main { flex: 1; width: 100%; max-width: 1110px; margin: 0 auto; padding: 40px 16px 64px; }
  h2 { font-size: 1.375rem; margin: 0 0 12px; }

  .arrow-link {
    display: inline-flex; align-items: center; font-weight: 600; text-decoration: none;
  }
  .arrow-link svg { flex: none; margin-right: 12px; transition: transform 0.2s ease-in-out; }
  .arrow-link:hover, .arrow-link:focus-visible { text-decoration: underline; text-decoration-color: var(--link-hover); }
  .arrow-link:hover svg, .arrow-link:focus-visible svg { transform: translateX(5px); }
  svg.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px; border: 1px solid transparent;
    background: var(--accent-soft); font-size: 0.9rem; margin-bottom: var(--gap);
  }
  .status.warn { background: var(--warn-bg); border-color: var(--warn); }
  .status.err { background: var(--err-bg); border-color: var(--err); }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid currentColor; border-right-color: transparent;
    animation: spin 0.8s linear infinite; flex: none;
  }
  .status:not(.busy) .spinner, button:not(.busy) .spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card { background: var(--surface); border-radius: 16px; padding: 24px 32px 32px; }
  .card.upload { background: var(--surface-blue); }
  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; min-height: 160px; text-align: center;
    border: 2px dashed var(--accent); border-radius: 12px; padding: 16px;
    cursor: pointer; transition: background 0.15s;
  }
  .drop:hover, .drop.over { background: rgba(255, 255, 255, 0.6); }
  .drop small { color: var(--muted); }
  .picked { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .picked canvas { max-width: 220px; max-height: 160px; width: auto; height: auto; border-radius: 8px; }

  button.primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--accent-text); border: 0;
    padding: 12px 24px; border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
  button.link {
    background: none; border: 0; padding: 0; font: inherit; font-weight: 600;
    color: var(--text); cursor: pointer; text-decoration: none;
  }
  button:focus-visible, .drop:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .actions { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 0.9rem; }
  #error { color: var(--err); margin-top: 12px; }

  #results { margin-top: var(--gap); }
  .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--gap); }
  .views canvas { width: 100%; height: auto; border-radius: 8px; display: block; background: var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 0.88rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--gap); margin-top: var(--gap); }

  .scroll { max-height: 460px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--surface); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #ffffff; }
  tbody tr.sel { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
  tbody tr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .pbar { position: relative; min-width: 90px; }
  .pbar i { position: absolute; inset: 3px auto 3px 0; background: var(--bar); opacity: 0.6; border-radius: 3px; }
  .pbar b { position: relative; font-weight: 400; padding-left: 4px; }
  .empty { color: var(--muted); padding: 8px; }

  /* ---- footer ---- */
  .footer { margin-top: auto; background: var(--accent); color: #ffffff; }
  .footer-inner {
    padding-top: 32px; padding-bottom: 32px;
  }
  .footer p { margin: 0; max-width: 60ch; }

  @media (max-width: 600px) {
    .card { padding: 20px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap hero-inner">
    <div class="hero-text">
      <h1>Luontotyyppitunnistin</h1>
      <p class="lead" data-text="heroLead"></p>
    </div>
  </div>
</header>
<main>

  <div id="status" class="status busy" role="status" aria-live="polite">
    <span class="spinner"></span><span id="status-text"></span>
  </div>

  <section class="card upload">
    <div id="drop" class="drop" tabindex="0" role="button" data-aria-label="dropAria">
      <strong data-text="dropTitle"></strong>
      <small data-text="dropHint"></small>
    </div>
    <input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" hidden>
    <div id="picked" class="picked" hidden>
      <canvas id="preview"></canvas>
      <div>
        <div class="actions">
          <button id="predict" class="primary" type="button">
            <span class="spinner"></span><span id="predict-text"></span>
          </button>
          <button id="change" class="link arrow-link" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-text="changeImage"></span></button>
        </div>
        <p id="predict-hint" class="hint"></p>
      </div>
    </div>
    <div id="error" role="alert" hidden></div>
  </section>

  <section id="results" hidden>
    <div class="views">
      <div class="card">
        <h2 data-text="overlayTitle"></h2>
        <canvas id="overlay"></canvas>
        <div id="legend" class="legend"></div>
      </div>
      <div class="card">
        <h2 id="selected-title" data-text="selectedTitle"></h2>
        <canvas id="selected"></canvas>
      </div>
    </div>
    <div class="tables">
      <div class="card">
        <h2 data-text="predictedTitle"></h2>
        <div class="scroll"><table id="t-pred"></table></div>
      </div>
      <div class="card">
        <h2 data-text="allTitle"></h2>
        <div class="scroll"><table id="t-all"></table></div>
      </div>
    </div>
  </section>

</main>
<footer class="footer">
  <div class="wrap footer-inner">
    <p data-text="footer"></p>
  </div>
</footer>

<script>
// ======================================================================
// TEKSTIT / UI TEXTS: edit the visible texts here.
// (<title> and <meta name="description"> in <head> are separate.)
// ======================================================================
const TEXT = {
  // Page
  heroLead:
    "Tulkitsee kuvasta todennäköisimmän luontotyypin ja näyttää mitkä alueet kuvasta vaikuttavat ennusteeseen. " +
    "Klikkaa luokan nimeä kummassa tahansa taulukossa luokkakohtaisia vaikutuskarttoja varten.",
  footer: "Ennusteet ovat kokeellisia. Kuvat analysoidaan omalla palvelimellaan, eikä niitä tallenneta tai lähetetä kolmansille osapuolille.",

  // Upload
  dropAria: "Valitse kuva tai pudota se tähän",
  dropTitle: "Pudota kuva tähän tai valitse napsauttamalla",
  dropHint: "JPEG, PNG tai WebP. Suuret kuvat pienennetään selaimessasi ennen lähetystä.",
  changeImage: "Valitse toinen kuva",
  predict: "Tunnista",
  predicting: "Analysoidaan…",
  modelStillLoading: "Mallia ladataan...",

  // Results
  overlayTitle: "Vaikutuskartta (ennustetut luokat)",
  selectedTitle: "Valitun luokan vaikutuskartta",
  predictedTitle: "Ennustetut luontotyypit",
  allTitle: "Kaikki luokat",
  colClass: "Luontotyyppi",
  colProbability: "Todennäköisyys",
  colThreshold: "Kynnysarvo",
  noneAboveThreshold: "Mikään luokka ei ylittänyt kynnysarvoaan.",

  // Server status
  connecting: "Yhdistetään mallipalvelimeen…",
  modelReady: "Malli valmis",
  modelLoading: "Ladataan mallia…",
  modelLoadingCanPick: " voit jo valita kuvan.",
  modelLoadFailed: "Mallin lataus epäonnistui: ",   // + server error
  serverRetrying: "Palvelimeen ei saada yhteyttä, yritetään uudelleen…",

  // Errors
  notAnImage: "Valitse kuvatiedosto.",
  unreadableImage: "Kuvaa ei voitu lukea.",
  serverUnreachable: "Palvelimeen ei saatu yhteyttä. Yritä uudelleen.",
  serverError: "Palvelinvirhe (HTTP ",               // + status + ")"
};

for (const el of document.querySelectorAll("[data-text]")) el.textContent = TEXT[el.dataset.text];
for (const el of document.querySelectorAll("[data-aria-label]")) el.setAttribute("aria-label", TEXT[el.dataset.ariaLabel]);
</script>

<script>
"use strict";

const API = "https://mikkoim--habitat-codebook-api-api.modal.run";
const MAX_SIDE = 1024;        // keep in sync with the server's MAX_IMAGE_SIDE
const OVERLAY_ALPHA = 0.7;

const $ = (id) => document.getElementById(id);
const els = {
  status: $("status"), statusText: $("status-text"),
  drop: $("drop"), file: $("file"), picked: $("picked"), preview: $("preview"),
  predict: $("predict"), predictText: $("predict-text"), predictHint: $("predict-hint"),
  change: $("change"), error: $("error"),
  results: $("results"), overlay: $("overlay"), selected: $("selected"),
  selectedTitle: $("selected-title"), legend: $("legend"),
  tPred: $("t-pred"), tAll: $("t-all"),
};

const state = {
  ready: false,       // model loaded on the server
  image: null,        // canvas holding the downscaled upload
  busy: false,
  data: null,         // last /predict response, masks decoded
  base: null,         // ImageData of the image at response size
  selected: null,     // selected class name
};

// ---------- server status: also wakes the Modal container ----------

function setStatus(text, kind) {
  els.statusText.textContent = text;
  els.status.className = "status" + (kind ? " " + kind : "");
}

async function pollStatus(attempt = 0) {
  try {
    const r = await fetch(API + "/status");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = await r.json();
    if (s.error) {
      setStatus(TEXT.modelLoadFailed + s.error, "err");
      return;
    }
    if (s.ready) {
      state.ready = true;
      setStatus(TEXT.modelReady, "");
      updatePredictButton();
      return;
    }
    setStatus(TEXT.modelLoading + (state.image ? "" : TEXT.modelLoadingCanPick), "busy");
    setTimeout(() => pollStatus(0), 1000);
  } catch (e) {
    setStatus(TEXT.serverRetrying, "warn busy");
    setTimeout(() => pollStatus(attempt + 1), Math.min(1000 * 2 ** attempt, 10000));
  }
}

// ---------- image selection ----------

async function loadImage(file) {
  if (!file || !file.type.startsWith("image/")) {
    showError(TEXT.notAnImage);
    return;
  }
  showError("");
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
  } catch {
    showError(TEXT.unreadableImage);
    return;
  }
  const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bitmap.width * scale));
  c.height = Math.max(1, Math.round(bitmap.height * scale));
  c.getContext("2d").drawImage(bitmap, 0, 0, c.width, c.height);
  bitmap.close();

  state.image = c;
  els.preview.width = c.width;
  els.preview.height = c.height;
  els.preview.getContext("2d").drawImage(c, 0, 0);
  els.drop.hidden = true;
  els.picked.hidden = false;
  els.results.hidden = true;
  state.data = null;
  updatePredictButton();
}

function updatePredictButton() {
  els.predict.disabled = !state.image || state.busy;
  els.predict.classList.toggle("busy", state.busy);
  els.predictText.textContent = state.busy ? TEXT.predicting : TEXT.predict;
  els.predictHint.textContent =
    state.image && !state.ready && !state.busy
      ? TEXT.modelStillLoading
      : "";
}

function showError(msg) {
  els.error.textContent = msg;
  els.error.hidden = !msg;
}

// ---------- prediction ----------

function decodeMask(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function predict() {
  if (!state.image || state.busy) return;
  state.busy = true;
  showError("");
  updatePredictButton();
  try {
    const blob = await new Promise((res) => state.image.toBlob(res, "image/jpeg", 0.9));
    const form = new FormData();
    form.append("file", blob, "image.jpg");
    const r = await fetch(API + "/predict", { method: "POST", body: form });
    if (!r.ok) {
      let detail = "";
      try { detail = (await r.json()).detail; } catch {}
      throw new Error(detail || TEXT.serverError + r.status + ")");
    }
    const data = await r.json();
    for (const c of data.classes) c.maskData = decodeMask(c.mask);
    state.data = data;
    state.ready = true;
    showResults();
  } catch (e) {
    showError(e instanceof TypeError ? TEXT.serverUnreachable : e.message);
  } finally {
    state.busy = false;
    updatePredictButton();
  }
}

// ---------- rendering ----------

function prepareBase(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.drawImage(state.image, 0, 0, w, h);
  return ctx.getImageData(0, 0, w, h);
}

// Tints the brightened base image by `weight(cellIndex) -> [score 0..1, [r, g, b]]`.
function drawTinted(canvas, scoreAt, alpha) {
  const { width: W, height: H, grid } = state.data;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const out = ctx.createImageData(W, H);
  const src = state.base.data, dst = out.data;
  const colX = new Int32Array(W);
  for (let x = 0; x < W; x++) colX[x] = Math.min(grid.w - 1, Math.floor((x * grid.w) / W));
  let p = 0;
  for (let y = 0; y < H; y++) {
    const rowOff = Math.min(grid.h - 1, Math.floor((y * grid.h) / H)) * grid.w;
    for (let x = 0; x < W; x++, p += 4) {
      const [s, color] = scoreAt(rowOff + colX[x]);
      const a = alpha * s;
      for (let ch = 0; ch < 3; ch++) {
        const base = 0.8 * src[p + ch] + 0.2 * 255;   // brighten so overlays stand out
        dst[p + ch] = base * (1 - a) + color[ch] * a;
      }
      dst[p + 3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
}

function drawOverlay() {
  const predicted = state.data.classes.filter((c) => c.predicted);
  if (!predicted.length) {
    drawTinted(els.overlay, () => [0, [0, 0, 0]], 0);
    return;
  }
  // Per patch, the predicted class with the strongest attribution wins.
  const cells = state.data.grid.h * state.data.grid.w;
  const best = new Float32Array(cells);
  const bestColor = new Array(cells).fill(predicted[0].color);
  for (const c of predicted) {
    for (let i = 0; i < cells; i++) {
      const v = c.maskData[i] / 255;
      if (v > best[i]) { best[i] = v; bestColor[i] = c.color; }
    }
  }
  drawTinted(els.overlay, (i) => [best[i], bestColor[i]], OVERLAY_ALPHA);
}

function drawSelected() {
  const c = state.data.classes.find((k) => k.name === state.selected);
  if (!c) return;
  els.selectedTitle.textContent = c.name + "  (p = " + c.probability.toFixed(4) + ")";
  drawTinted(els.selected, (i) => [c.maskData[i] / 255, c.color], 1);
}

function cell(text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

function fillTable(table, rows, withThreshold) {
  table.replaceChildren();
  const head = table.createTHead().insertRow();
  const cols = withThreshold
    ? [TEXT.colClass, TEXT.colProbability, TEXT.colThreshold]
    : [TEXT.colClass, TEXT.colProbability];
  for (const name of cols) {
    const th = document.createElement("th");
    th.textContent = name;
    head.appendChild(th);
  }
  const body = table.createTBody();
  if (!rows.length) {
    const td = body.insertRow().insertCell();
    td.colSpan = cols.length;
    td.className = "empty";
    td.textContent = TEXT.noneAboveThreshold;
    return;
  }
  for (const c of rows) {
    const tr = body.insertRow();
    tr.tabIndex = 0;
    tr.dataset.name = c.name;
    tr.appendChild(cell(c.name));
    const bar = document.createElement("td");
    bar.className = "pbar";
    const fill = document.createElement("i");
    fill.style.width = (c.probability * 100).toFixed(1) + "%";
    const label = document.createElement("b");
    label.textContent = c.probability.toFixed(4);
    bar.append(fill, label);
    tr.appendChild(bar);
    if (withThreshold) tr.appendChild(cell(c.threshold.toFixed(4), "num"));
    const select = () => selectClass(c.name);
    tr.addEventListener("click", select);
    tr.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); }
    });
  }
}

function selectClass(name) {
  state.selected = name;
  for (const tr of document.querySelectorAll("tbody tr[data-name]")) {
    tr.classList.toggle("sel", tr.dataset.name === name);
  }
  drawSelected();
}

function showResults() {
  const { width, height, classes } = state.data;
  state.base = prepareBase(width, height);
  const predicted = classes.filter((c) => c.predicted);

  fillTable(els.tPred, predicted, true);
  fillTable(els.tAll, classes, false);

  els.legend.replaceChildren();
  for (const c of predicted) {
    const item = document.createElement("span");
    const sw = document.createElement("i");
    sw.className = "swatch";
    sw.style.background = "rgb(" + c.color.join(",") + ")";
    item.append(sw, c.name);
    els.legend.appendChild(item);
  }

  drawOverlay();
  els.results.hidden = false;
  selectClass((predicted[0] || classes[0]).name);
  els.results.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---------- wiring ----------

els.drop.addEventListener("click", () => els.file.click());
els.drop.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); els.file.click(); }
});
els.change.addEventListener("click", () => els.file.click());
els.file.addEventListener("change", () => {
  loadImage(els.file.files[0]);
  els.file.value = "";
});
for (const ev of ["dragenter", "dragover"]) {
  els.drop.addEventListener(ev, (e) => { e.preventDefault(); els.drop.classList.add("over"); });
}
for (const ev of ["dragleave", "drop"]) {
  els.drop.addEventListener(ev, (e) => { e.preventDefault(); els.drop.classList.remove("over"); });
}
els.drop.addEventListener("drop", (e) => loadImage(e.dataTransfer.files[0]));
els.predict.addEventListener("click", predict);

setStatus(TEXT.connecting, "busy");
updatePredictButton();
pollStatus();
</script>
</body>
</html>
